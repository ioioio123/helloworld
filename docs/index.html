<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>ESP32-C3 点焊机</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --fg: #e6edf3; --dim: #8b949e;
    --green: #3fb950; --red: #f85149; --yellow: #d29922; --cyan: #39c5cf;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
    font: 15px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 520px; margin-inline: auto;
  }
  header { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3b424c; transition: .25s; }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
  }
  .panel-title {
    font-size: 12px; color: var(--dim); letter-spacing: .06em;
    margin-bottom: 8px; display: flex; justify-content: space-between;
  }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #238636;
    border: 0; border-radius: 10px; padding: 13px 16px; width: 100%;
    cursor: pointer; transition: filter .15s;
  }
  button:active { filter: brightness(.88); }
  button.secondary { background: #21262d; border: 1px solid var(--line); }
  button.danger { background: #b62324; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cell { background: #0b0f14; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  .cell.wide { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; }
  .label { font-size: 11.5px; color: var(--dim); letter-spacing: .05em; }
  .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .value.sm { font-size: 19px; }
  .value small { font-size: 13px; font-weight: 400; color: var(--dim); margin-left: 3px; }
  .bad { color: var(--red); }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #05080b; }
  input[type=range] { width: 100%; accent-color: var(--green); margin: 4px 0 10px; }
  .hint { font-size: 11.5px; color: var(--dim); margin-top: 8px; line-height: 1.45; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--dim); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>ESP32-C3 点焊机</h1>
</header>

<div class="panel">
  <button id="connect">连接设备</button>
  <div class="hint" id="status">未连接</div>
</div>

<div class="panel">
  <div class="stats">
    <div class="cell">
      <div class="label">峰值电流</div>
      <div class="value" id="peak">–<small>A</small></div>
    </div>
    <div class="cell">
      <div class="label">有效电流 (RMS)</div>
      <div class="value" id="rms">–<small>A</small></div>
    </div>
    <div class="cell">
      <div class="label">温度</div>
      <div class="value sm" id="temp">–<small>℃</small></div>
    </div>
    <div class="cell">
      <div class="label">实测脉宽</div>
      <div class="value sm" id="pulse">–<small>ms</small></div>
    </div>
    <div class="cell wide">
      <span class="label">累计次数</span>
      <span class="value sm" id="count">–</span>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">
    <span>电流包络</span>
    <span id="win">– ms 窗口</span>
  </div>
  <canvas id="chart" width="360" height="200"></canvas>
  <div class="legend">
    <span><i style="background:#39c5cf"></i>瞬时电流</span>
    <span><i style="background:rgba(248,81,73,.85)"></i>峰值位置</span>
    <span><i style="background:rgba(63,185,80,.25)"></i>放电窗口</span>
  </div>
</div>

<div class="panel">
  <div class="panel-title"><span>设定脉宽</span><span id="pwLabel">10.0 ms</span></div>
  <input type="range" id="pw" min="1" max="48" step="0.5" value="10">
  <div class="row2">
    <button class="secondary" id="setPw">下发脉宽</button>
    <button class="danger" id="fire" disabled>触发放电</button>
  </div>
  <div class="hint">
    远程触发与脚踏共用同一套安全联锁：1 秒冷却、80℃ 锁定、50ms 看门狗。
  </div>
</div>

<script>
/* ---------- 配置（与固件保持一致） ---------- */
const A_PER_COUNT = 0.01;       // CURRENT_A_PER_COUNT
const RAW_MAX     = 4095;       // 12bit ADC
const BUCKETS     = 240;        // ENV_BUCKETS
const SVC  = '1a2b3c4d-0001-4a5b-8c9d-0e1f2a3b4c5d';
const TELE = '1a2b3c4d-0002-4a5b-8c9d-0e1f2a3b4c5d';
const ENV  = '1a2b3c4d-0003-4a5b-8c9d-0e1f2a3b4c5d';
const CTL  = '1a2b3c4d-0004-4a5b-8c9d-0e1f2a3b4c5d';

const $ = id => document.getElementById(id);
const cv = $('chart');
const ctx = cv.getContext('2d');
const CW = cv.width, CH = cv.height;
const PAD = { l: 52, r: 12, t: 16, b: 30 };
const PW = CW - PAD.l - PAD.r;
const PH = CH - PAD.t - PAD.b;

let dev = null, ctlChr = null;
let envA       = new Array(BUCKETS).fill(0);
let envPeakIdx = 0;
let peakA = 0, rmsA = 0, pulseMs = 10;
let spanMs = 12;            // 由固件遥测下发
let yMax = 10;

const fmt = (v, d) => v.toFixed(d);

function niceMax(v) {
  if (!(v > 0)) return 10;
  const steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  for (const s of steps) { const c = s * mag; if (c >= v * 1.08) return c; }
  return 10 * mag;
}

/* ---------- 绘图 ---------- */
function draw() {
  ctx.clearRect(0, 0, CW, CH);

  const x0 = PAD.l, y0 = PAD.t, x1 = PAD.l + PW, y1 = PAD.t + PH;
  const xAt = i => x0 + (i / (BUCKETS - 1)) * PW;
  const yAt = a => y1 - (Math.min(a, yMax) / yMax) * PH;

  /* 放电窗口底色 */
  const pulseX = x0 + Math.min(pulseMs / spanMs, 1) * PW;
  ctx.fillStyle = 'rgba(63,185,80,0.10)';
  ctx.fillRect(x0, y0, pulseX - x0, PH);

  /* Y 网格 + 刻度 */
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const yd = 4;
  for (let i = 0; i <= yd; i++) {
    const v = yMax * i / yd;
    const y = y1 - (PH * i / yd);
    ctx.strokeStyle = i === 0 ? '#2b3440' : '#161d27';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y + 0.5); ctx.lineTo(x1, y + 0.5); ctx.stroke();
    ctx.fillStyle = '#9aa4b2';
    ctx.fillText(v.toFixed(yMax <= 5 ? 2 : (yMax <= 20 ? 1 : 0)), x0 - 7, y);
  }

  /* X 网格 + 刻度 */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const xd = 4;
  for (let i = 0; i <= xd; i++) {
    const t = spanMs * i / xd;
    const x = x0 + PW * i / xd;
    ctx.strokeStyle = '#161d27';
    ctx.beginPath(); ctx.moveTo(x + 0.5, y0); ctx.lineTo(x + 0.5, y1); ctx.stroke();
    ctx.fillStyle = '#9aa4b2';
    ctx.fillText(t.toFixed(t < 10 ? 1 : 0), x, y1 + 7);
  }

  /* 轴标题（明显可见） */
  ctx.save();
  ctx.fillStyle = '#c9d1d9';
  ctx.font = '600 11px -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(13, y0 + PH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('电流 (A)', 0, 0);
  ctx.restore();

  ctx.fillStyle = '#c9d1d9';
  ctx.font = '600 11px -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText('时间 (ms)', x1, y1 + 15);

  /* 曲线填充 */
  const grad = ctx.createLinearGradient(0, y0, 0, y1);
  grad.addColorStop(0, 'rgba(57,197,207,0.34)');
  grad.addColorStop(1, 'rgba(57,197,207,0.02)');
  ctx.beginPath();
  ctx.moveTo(xAt(0), y1);
  for (let i = 0; i < BUCKETS; i++) ctx.lineTo(xAt(i), yAt(envA[i]));
  ctx.lineTo(xAt(BUCKETS - 1), y1);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  /* 曲线 */
  ctx.beginPath();
  for (let i = 0; i < BUCKETS; i++) {
    const x = xAt(i), y = yAt(envA[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#39c5cf';
  ctx.lineWidth = 1.7;
  ctx.lineJoin = 'round';
  ctx.stroke();

  /* 峰值定位线：数值用遥测里的精确峰值，位置用包络里最大桶 */
  if (peakA > 0.05) {
    const px = xAt(envPeakIdx);
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(248,81,73,0.9)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px + 0.5, y0); ctx.lineTo(px + 0.5, y1); ctx.stroke();
    ctx.restore();

    const text = '峰值 ' + peakA.toFixed(2) + ' A @ ' + (envPeakIdx / (BUCKETS - 1) * spanMs).toFixed(1) + ' ms';
    ctx.font = '10px ui-monospace, Menlo, Consolas, monospace';
    const tw = ctx.measureText(text).width;
    const tx = Math.min(Math.max(px + 5, x0 + 2), x1 - tw - 2);
    ctx.fillStyle = 'rgba(248,81,73,0.16)';
    ctx.fillRect(tx - 3, y0 + 1, tw + 6, 14);
    ctx.fillStyle = '#ff8b84';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(text, tx, y0 + 3);
  }
}

/* ---------- 数据 ---------- */
function onTelemetry(dv) {
  const s = new TextDecoder().decode(dv).trim();
  if (!s.startsWith('W,')) return;
  const f = s.split(',');
  if (f.length < 7) return;

  const peakRaw = parseInt(f[1]) || 0;
  const rmsRaw  = parseInt(f[2]) || 0;
  const temp10  = parseInt(f[3]) || 0;
  const pulseUs = parseInt(f[4]) || 0;
  const count   = f[5];
  const status  = parseInt(f[6]) || 0;
  const spanUs  = f.length >= 8 ? (parseInt(f[7]) || 0) : 0;

  peakA   = peakRaw * A_PER_COUNT;
  rmsA    = rmsRaw  * A_PER_COUNT;
  pulseMs = pulseUs / 1000;
  if (spanUs > 0) {
    spanMs = spanUs / 1000;
    $('win').textContent = spanMs.toFixed(0) + ' ms 窗口（脉宽 ' + pulseMs.toFixed(1) + ' ms）';
  }

  $('peak').innerHTML  = peakA.toFixed(2) + '<small>A</small>';
  $('rms').innerHTML   = rmsA.toFixed(2) + '<small>A</small>';
  $('temp').innerHTML  = (temp10 / 10).toFixed(1) + '<small>℃</small>';
  $('pulse').innerHTML = pulseMs.toFixed(2) + '<small>ms</small>';
  $('count').textContent = count;

  $('temp').className = temp10 < -200 ? 'value sm bad' : 'value sm';

  if (status === 2) setStatus('超温锁定，已禁止触发', true);
  else if (status === 1) setStatus('正在放电…', true);

  const y = niceMax(Math.max(peakA, 1));
  if (y !== yMax) yMax = y;
  draw();
}

function onEnvelope(dv) {
  const u8 = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  let best = 0;
  for (let i = 0; i < BUCKETS; i++) {
    const raw = i < u8.length ? u8[i] : 0;
    envA[i] = raw / 255 * RAW_MAX * A_PER_COUNT;
    if (envA[i] > best) { best = envA[i]; envPeakIdx = i; }
  }
  const y = niceMax(Math.max(peakA, best, 1));
  if (y !== yMax) yMax = y;
  draw();
}

function setStatus(text, on) {
  $('status').textContent = text;
  $('dot').className = 'dot' + (on ? ' on' : '');
}

/* ---------- 连接 ---------- */
async function connect() {
  if (!navigator.bluetooth) {
    setStatus('此浏览器不支持 Web Bluetooth（需 Android Chrome + HTTPS）', false);
    return;
  }
  try {
    setStatus('搜索中…');
    dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'WELDER' }],
      optionalServices: [SVC]
    });
    dev.addEventListener('gattserverdisconnected', () => {
      setStatus('连接已断开', false);
      $('fire').disabled = true;
      $('connect').textContent = '重新连接';
    });

    setStatus('连接中…');
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(SVC);

    const tele = await svc.getCharacteristic(TELE);
    const env  = await svc.getCharacteristic(ENV);
    ctlChr     = await svc.getCharacteristic(CTL);

    tele.addEventListener('characteristicvaluechanged', e => onTelemetry(e.target.value));
    env.addEventListener('characteristicvaluechanged',  e => onEnvelope(e.target.value));
    await tele.startNotifications();
    await env.startNotifications();

    $('fire').disabled = false;
    $('connect').textContent = '已连接';
    setStatus('已连接：' + (dev.name || 'WELDER-C3'), true);
  } catch (err) {
    setStatus('失败：' + err.message, false);
  }
}

/* ---------- 命令 ---------- */
async function send(text) {
  if (!ctlChr) return;
  const bytes = new TextEncoder().encode(text);
  try { await ctlChr.writeValueWithResponse(bytes); }
  catch (e1) {
    try { await ctlChr.writeValueWithoutResponse(bytes); }
    catch (e2) { setStatus('写入失败：' + e2.message, false); }
  }
}

$('connect').onclick = connect;
$('fire').onclick = () => { if (confirm('确认放电？')) send('F'); };
$('pw').oninput = e => $('pwLabel').textContent = parseFloat(e.target.value).toFixed(1) + ' ms';
$('setPw').onclick = () => {
  const us = Math.round(parseFloat($('pw').value) * 1000);
  send('P' + us);
  setStatus('已下发脉宽 ' + (us / 1000).toFixed(1) + ' ms', true);
};

draw();
</script>
</body>
</html>
